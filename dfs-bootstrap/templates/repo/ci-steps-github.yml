# dfs-bootstrap CI wiring — paste into the existing static-invariants job (or an equivalent
# stdlib-only job). Generated by `bootstrap.py --emit-ci github`; do not edit the generator.
#
# Why two steps, not one: the audit enforces the CURRENT debt ceiling (ratchet baseline) and the
# guard forbids anyone from RAISING that ceiling. Deleting either step reopens a different hole:
# - audit gone   -> new violations land silently;
# - guard gone   -> someone edits allowed_* upward to make CI green and the ratchet is dead.
# The paired guard test (ci-wiring-guard-test.py.txt) makes both deletions fail a test.

      # dfs-bootstrap: structure gate — full import graph, ratcheted baseline
      - name: Structure gate (cycles/fanout/length/nesting/stubs, ratcheted)
        run: python3 scripts/check_repo_structure.py --all

      # dfs-bootstrap: ratchet — allowed_* may only decrease vs the value committed at HEAD
      - name: Structure ratchet guard (no tolerance increase)
        run: python3 scripts/check_repo_structure.py --ratchet-guard
